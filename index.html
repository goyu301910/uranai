<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0f766e">
    <title>今日の運勢ブレンド</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css?v=4">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="app-title">
        <div class="hero-copy">
          <p class="eyebrow" id="dateLabel">今日</p>
          <h1 id="app-title">今日の運勢ブレンド</h1>
          <p class="lead">複数ソースのスコアを平均して、その日の流れをひとつにまとめます。</p>
        </div>
        <div class="hero-actions">
          <label class="field">
            <span>星座</span>
            <select id="signSelect" aria-label="星座を選択">
              <option value="aries">おひつじ座</option>
              <option value="taurus">おうし座</option>
              <option value="gemini">ふたご座</option>
              <option value="cancer">かに座</option>
              <option value="leo">しし座</option>
              <option value="virgo">おとめ座</option>
              <option value="libra">てんびん座</option>
              <option value="scorpio">さそり座</option>
              <option value="sagittarius">いて座</option>
              <option value="capricorn">やぎ座</option>
              <option value="aquarius">みずがめ座</option>
              <option value="pisces">うお座</option>
            </select>
          </label>
          <button class="refresh-button" id="refreshButton" type="button" aria-label="最新の運勢を取得">
            <span class="refresh-icon" aria-hidden="true">↻</span>
            <span class="button-text">更新</span>
          </button>
        </div>
      </section>

      <section class="dashboard" aria-live="polite">
        <article class="score-panel">
          <div class="score-ring" id="scoreRing" style="--score: 0">
            <div>
              <span class="score-number" id="scoreNumber">--</span>
              <span class="score-unit">点</span>
            </div>
          </div>
          <div class="score-copy">
            <p class="result-label" id="resultLabel">読み込み中</p>
            <h2 id="signHeading">今日の運勢</h2>
            <div class="rank-summary">
              <span>平均順位</span>
              <strong id="averageRank">--</strong>
            </div>
            <p id="adviceText">日付と星座に合わせて集計します。</p>
          </div>
        </article>

        <article class="luck-panel">
          <dl>
            <div>
              <dt>ラッキーカラー</dt>
              <dd id="luckyColor">--</dd>
            </div>
            <div>
              <dt>ラッキーアイテム</dt>
              <dd id="luckyItem">--</dd>
            </div>
            <div>
              <dt>今日の一手</dt>
              <dd id="luckyAction">--</dd>
            </div>
          </dl>
        </article>
      </section>

      <section class="sources-section" aria-labelledby="sourcesTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow">平均の内訳</p>
            <h2 id="sourcesTitle">取得ソース</h2>
          </div>
          <p class="source-count" id="sourceCount">--</p>
        </div>
        <div class="source-grid" id="sourceGrid"></div>
      </section>
    </main>

    <script src="app.js?v=4" type="module"></script>
  </body>
</html>
